      # CEEx2 (A, B)
      - {name: "117_2_BRK_CEEx2_Busbar_A", default_closed: false}
      - {name: "117_2_BRK_CEEx2_Busbar_B", default_closed: false}
      # Cable_X — single-breaker crosslinks to 117-5
      - {name: "117_2_BRK_Cable_X1A_2_Busbar_A", default_closed: false}
