      - {name: "319_4_BRK_Spare_3_Busbar_A", default_closed: false}
      - {name: "319_4_BRK_Spare_3_Busbar_B", default_closed: false}
      # Cable_K1A → 330-12  (B, C)
      - {name: "319_4_BRK_Cable_K1A_Busbar_B", default_closed: false}
      - {name: "319_4_BRK_Cable_K1A_Busbar_C", default_closed: false}
      # Cable_K1B → 330-12  (B, C)
      - {name: "319_4_BRK_Cable_K1B_Busbar_B", default_closed: false}
      - {name: "319_4_BRK_Cable_K1B_Busbar_C", default_closed: false}
      # Cable_K2A → 330-12  (A, B)
      - {name: "319_4_BRK_Cable_K2A_Busbar_A", default_closed: false}
      - {name: "319_4_BRK_Cable_K2A_Busbar_B", default_closed: false}
      # Cable_K2B → 330-12  (A, B)
      - {name: "319_4_BRK_Cable_K2B_Busbar_A", default_closed: false}
      - {name: "319_4_BRK_Cable_K2B_Busbar_B", default_closed: false}
      # Cable_J1A → 310-2  (B, C)
      - {name: "319_4_BRK_Cable_J1A_Busbar_B", default_closed: false}
      - {name: "319_4_BRK_Cable_J1A_Busbar_C", default_closed: false}
      # Cable_J1B → 310-2  (B, C)
      - {name: "319_4_BRK_Cable_J1B_Busbar_B", default_closed: false}
      - {name: "319_4_BRK_Cable_J1B_Busbar_C", default_closed: false}
      # Cable_J2A → 310-2  (A, C)
      - {name: "319_4_BRK_Cable_J2A_Busbar_A", default_closed: false}
      - {name: "319_4_BRK_Cable_J2A_Busbar_C", default_closed: false}
      # Cable_J2B → 310-2  (A, C)
      - {name: "319_4_BRK_Cable_J2B_Busbar_A", default_closed: false}
      - {name: "319_4_BRK_Cable_J2B_Busbar_C", default_closed: false}
    interlocks:
      - {group: "Spare_1", max_closed: 1, members: ["319_4_BRK_Spare_1_Busbar_A", "319_4_BRK_Spare_1_Busbar_C"]}
      - {group: "Spare_2", max_closed: 1, members: ["319_4_BRK_Spare_2_Busbar_A", "319_4_BRK_Spare_2_Busbar_B"]}
      - {group: "P2X", max_closed: 1, members: ["319_4_BRK_P2X_Busbar_A", "319_4_BRK_P2X_Busbar_C"]}
      - {group: "GridEmu", max_closed: 1, members: ["319_4_BRK_GridEmu_Busbar_B", "319_4_BRK_GridEmu_Busbar_C"]}
      - {group: "Spare_3", max_closed: 1, members: ["319_4_BRK_Spare_3_Busbar_A", "319_4_BRK_Spare_3_Busbar_B"]}
      - {group: "Cable_K1A", max_closed: 1, members: ["319_4_BRK_Cable_K1A_Busbar_B", "319_4_BRK_Cable_K1A_Busbar_C"]}
      - {group: "Cable_K1B", max_closed: 1, members: ["319_4_BRK_Cable_K1B_Busbar_B", "319_4_BRK_Cable_K1B_Busbar_C"]}
      - {group: "Cable_K2A", max_closed: 1, members: ["319_4_BRK_Cable_K2A_Busbar_A", "319_4_BRK_Cable_K2A_Busbar_B"]}
      - {group: "Cable_K2B", max_closed: 1, members: ["319_4_BRK_Cable_K2B_Busbar_A", "319_4_BRK_Cable_K2B_Busbar_B"]}
