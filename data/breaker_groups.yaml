# ═══════════════════════════════════════════════════════════════════
# Inline Ports
# ═══════════════════════════════════════════════════════════════════
# Cable plug points on 319-3 and 319-4 where mobile equipment can
# be inserted. All ports share the same 4 operating modes. Graph
# mutation logic is deferred to a future phase.

inline_ports:

  # ── 319-3 Cable Bays (16 ports) ─────────────────────────────────

  - name: "A1A Port"
    cable: "A1A"
    location: "319-3 end"
    description: "Inline plug at cable A1A between 319-3 and 319-2."
    modes: &standard_modes
      - {name: pass-through, description: "Cable connected directly — no inserted equipment", default: true}
      - {name: b2b-converter, description: "Back-to-back converter inserted — galvanic isolation"}
      - {name: load-tap, description: "Load/source tapped at port — adds a branch to the cable midpoint"}
      - {name: impedance-extension, description: "Additional impedance inserted in series with the cable"}

  - name: "A1B Port"
    cable: "A1B"
    location: "319-3 end"
    description: "Inline plug at cable A1B between 319-3 and 319-2."
