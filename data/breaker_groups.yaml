# Breaker groups — documentation, grouping, and switching constraints
#
# Each group collects related breakers with a description,
# default states, and optional interlocks.
#
# Conventions:
#   - One group per switchboard (documenting all its bays and switches)
#   - The crossbar group is separate (spans 319-3 ↔ 319-4)
#   - Interlocks: every bay with 2+ breakers on different busbars
#     gets max_closed=1 (only connected to one busbar at a time)
#   - Single-breaker bays have no interlock entry
#
# Inline ports document cable plug points where mobile equipment
# can be inserted.  Graph mutation logic for inline ports is
# deferred to a future phase; only schema + documentation for now.

breaker_groups:

  # ─────────────────────────────────────────────────────────────────
  # 319-3/319-4 Crossbar (spans two switchboards)
  # ─────────────────────────────────────────────────────────────────
  - name: "319-3/319-4 Crossbar"
    type: full-telemetry
    description: |
      Interconnection matrix between 319-3 and 319-4 busbars.
      Each Cross bay has an interlock — only one breaker per bay
      can be closed at a time.

      Switching matrix (interlocked — max 1 per row):

                  319-4 A      319-4 B      319-4 C
      319-3 A    Cross_A_A    Cross_A_B       —
      319-3 B       —         Cross_B_B    Cross_B_C
      319-3 C    Cross_C_A       —         Cross_C_C
    switches:
      - name: "319_4_BRK_Cross_A_Busbar_A"
        default_closed: false
      - name: "319_4_BRK_Cross_A_Busbar_B"
        default_closed: false
      - name: "319_4_BRK_Cross_B_Busbar_B"
        default_closed: false
      - name: "319_4_BRK_Cross_B_Busbar_C"
        default_closed: false
      - name: "319_4_BRK_Cross_C_Busbar_A"
        default_closed: false
      - name: "319_4_BRK_Cross_C_Busbar_C"
        default_closed: false
    interlocks:
      - group: "Cross_A"
        max_closed: 1
        members:
          - "319_4_BRK_Cross_A_Busbar_A"
          - "319_4_BRK_Cross_A_Busbar_B"
      - group: "Cross_B"
        max_closed: 1
        members:
          - "319_4_BRK_Cross_B_Busbar_B"
          - "319_4_BRK_Cross_B_Busbar_C"
      - group: "Cross_C"
        max_closed: 1
        members:
          - "319_4_BRK_Cross_C_Busbar_A"
          - "319_4_BRK_Cross_C_Busbar_C"

  # ─────────────────────────────────────────────────────────────────
  # Switchboard 319-2  (Building 319, syslab-01)
  # ─────────────────────────────────────────────────────────────────
  - name: "Switchboard 319-2"
    type: full-telemetry
    description: |
      DER hub in the turbine hall (Building 319). Houses diesel genset,
      dump load, PV inverter (pv319), AirCon wind turbine, and CEE sockets.
      2 busbars (A, B). Grid connection on Busbar-B only.
      Connected to 319-3 via Cable A (4 runs: A1A, A1B, A2A, A2B).
    switches:
      # Grid — single breaker, B only
      - {name: "319_2_BRK_Grid_Busbar_B", default_closed: false}
      # Diesel
      - {name: "319_2_BRK_Diesel_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_Diesel_Busbar_B", default_closed: false}
      # Dumpload
      - {name: "319_2_BRK_Dumpload_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_Dumpload_Busbar_B", default_closed: false}
      # CEEx2
      - {name: "319_2_BRK_CEEx2_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_CEEx2_Busbar_B", default_closed: false}
      # CEE
      - {name: "319_2_BRK_CEE_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_CEE_Busbar_B", default_closed: false}
      # Aircon
      - {name: "319_2_BRK_Aircon_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_Aircon_Busbar_B", default_closed: false}
      # Cable_A1A → 319-3
      - {name: "319_2_BRK_Cable_A1A_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_Cable_A1A_Busbar_B", default_closed: false}
      # Cable_A1B → 319-3
      - {name: "319_2_BRK_Cable_A1B_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_Cable_A1B_Busbar_B", default_closed: false}
      # Cable_A2A → 319-3
      - {name: "319_2_BRK_Cable_A2A_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_Cable_A2A_Busbar_B", default_closed: false}
      # Cable_A2B → 319-3
      - {name: "319_2_BRK_Cable_A2B_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_Cable_A2B_Busbar_B", default_closed: false}
      # PV
      - {name: "319_2_BRK_PV_Busbar_A", default_closed: false}
      - {name: "319_2_BRK_PV_Busbar_B", default_closed: false}
    interlocks:
      - {group: "Diesel", max_closed: 1, members: ["319_2_BRK_Diesel_Busbar_A", "319_2_BRK_Diesel_Busbar_B"]}
      - {group: "Dumpload", max_closed: 1, members: ["319_2_BRK_Dumpload_Busbar_A", "319_2_BRK_Dumpload_Busbar_B"]}
      - {group: "CEEx2", max_closed: 1, members: ["319_2_BRK_CEEx2_Busbar_A", "319_2_BRK_CEEx2_Busbar_B"]}
      - {group: "CEE", max_closed: 1, members: ["319_2_BRK_CEE_Busbar_A", "319_2_BRK_CEE_Busbar_B"]}
      - {group: "Aircon", max_closed: 1, members: ["319_2_BRK_Aircon_Busbar_A", "319_2_BRK_Aircon_Busbar_B"]}
      - {group: "Cable_A1A", max_closed: 1, members: ["319_2_BRK_Cable_A1A_Busbar_A", "319_2_BRK_Cable_A1A_Busbar_B"]}
      - {group: "Cable_A1B", max_closed: 1, members: ["319_2_BRK_Cable_A1B_Busbar_A", "319_2_BRK_Cable_A1B_Busbar_B"]}
      - {group: "Cable_A2A", max_closed: 1, members: ["319_2_BRK_Cable_A2A_Busbar_A", "319_2_BRK_Cable_A2A_Busbar_B"]}
      - {group: "Cable_A2B", max_closed: 1, members: ["319_2_BRK_Cable_A2B_Busbar_A", "319_2_BRK_Cable_A2B_Busbar_B"]}
      - {group: "PV", max_closed: 1, members: ["319_2_BRK_PV_Busbar_A", "319_2_BRK_PV_Busbar_B"]}

  # ─────────────────────────────────────────────────────────────────
  # Switchboard 319-3  (Building 319, syslab-52)
  # ─────────────────────────────────────────────────────────────────
  - name: "Switchboard 319-3"
    type: full-telemetry
    description: |
      Central switching hub (Building 319). 5 busbars: A, B, C, Supply,
      Transformer. ALL outer switchboards (319-2, 715-2, 117-2, 716-2)
      connect here via Cables A, B, C, E. Houses ABB B2B converter
      (primary on Supply busbar, secondary on B or C) and Grid Emulator
      primary (Amp_1 on Transformer busbar). Grid infeed on Busbar-A.
      Cross bays linking to 319-4 are in the separate Crossbar group.
    switches:
      # Supply / Transformer bays — single breaker each
      - {name: "319_3_BRK_Supply_Busbar_Transformer", default_closed: false}
      - {name: "319_3_BRK_Spare_Busbar_Transformer", default_closed: false}
      - {name: "319_3_BRK_Amp_1_Busbar_Transformer", default_closed: false}
      - {name: "319_3_BRK_Amp_2_Busbar_Transformer", default_closed: false}
      # Grid — single breaker, A only
      - {name: "319_3_BRK_Grid_Busbar_A", default_closed: false}
      # ABB B2B converter
      - {name: "319_3_BRK_ABB_Pri_Busbar_Supply", default_closed: false}
      - {name: "319_3_BRK_ABB_Sec_Busbar_B", default_closed: false}
      - {name: "319_3_BRK_ABB_Sec_Busbar_C", default_closed: false}
      # Cable_E2A → 716-2  (A, C)
      - {name: "319_3_BRK_Cable_E2A_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_E2A_Busbar_C", default_closed: false}
      # Cable_E2B → 716-2  (A, C)
      - {name: "319_3_BRK_Cable_E2B_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_E2B_Busbar_C", default_closed: false}
      # Cable_E1A → 716-2  (A, B)
      - {name: "319_3_BRK_Cable_E1A_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_E1A_Busbar_B", default_closed: false}
      # Cable_E1B → 716-2  (A, B)
      - {name: "319_3_BRK_Cable_E1B_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_E1B_Busbar_B", default_closed: false}
      # Cable_B2A → 715-2  (A, B)
      - {name: "319_3_BRK_Cable_B2A_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_B2A_Busbar_B", default_closed: false}
      # Cable_B2B → 715-2  (A, B)
      - {name: "319_3_BRK_Cable_B2B_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_B2B_Busbar_B", default_closed: false}
      # Cable_B1A → 715-2  (B, C)
      - {name: "319_3_BRK_Cable_B1A_Busbar_B", default_closed: false}
      - {name: "319_3_BRK_Cable_B1A_Busbar_C", default_closed: false}
      # Cable_B1B → 715-2  (B, C)
      - {name: "319_3_BRK_Cable_B1B_Busbar_B", default_closed: false}
      - {name: "319_3_BRK_Cable_B1B_Busbar_C", default_closed: false}
      # Cable_A2A → 319-2  (B, C)
      - {name: "319_3_BRK_Cable_A2A_Busbar_B", default_closed: false}
      - {name: "319_3_BRK_Cable_A2A_Busbar_C", default_closed: false}
      # Cable_A2B → 319-2  (B, C)
      - {name: "319_3_BRK_Cable_A2B_Busbar_B", default_closed: false}
      - {name: "319_3_BRK_Cable_A2B_Busbar_C", default_closed: false}
      # Cable_A1A → 319-2  (A, C)
      - {name: "319_3_BRK_Cable_A1A_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_A1A_Busbar_C", default_closed: false}
      # Cable_A1B → 319-2  (A, C)
      - {name: "319_3_BRK_Cable_A1B_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_A1B_Busbar_C", default_closed: false}
      # Cable_C2A → 117-2  (A, C)
      - {name: "319_3_BRK_Cable_C2A_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_C2A_Busbar_C", default_closed: false}
      # Cable_C2B → 117-2  (A, C)
      - {name: "319_3_BRK_Cable_C2B_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_C2B_Busbar_C", default_closed: false}
      # Cable_C1A → 117-2  (A, B)
      - {name: "319_3_BRK_Cable_C1A_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_C1A_Busbar_B", default_closed: false}
      # Cable_C1B → 117-2  (A, B)
      - {name: "319_3_BRK_Cable_C1B_Busbar_A", default_closed: false}
      - {name: "319_3_BRK_Cable_C1B_Busbar_B", default_closed: false}
    interlocks:
      - {group: "ABB_Sec", max_closed: 1, members: ["319_3_BRK_ABB_Sec_Busbar_B", "319_3_BRK_ABB_Sec_Busbar_C"]}
      - {group: "Cable_E2A", max_closed: 1, members: ["319_3_BRK_Cable_E2A_Busbar_A", "319_3_BRK_Cable_E2A_Busbar_C"]}
      - {group: "Cable_E2B", max_closed: 1, members: ["319_3_BRK_Cable_E2B_Busbar_A", "319_3_BRK_Cable_E2B_Busbar_C"]}
      - {group: "Cable_E1A", max_closed: 1, members: ["319_3_BRK_Cable_E1A_Busbar_A", "319_3_BRK_Cable_E1A_Busbar_B"]}
      - {group: "Cable_E1B", max_closed: 1, members: ["319_3_BRK_Cable_E1B_Busbar_A", "319_3_BRK_Cable_E1B_Busbar_B"]}
      - {group: "Cable_B2A", max_closed: 1, members: ["319_3_BRK_Cable_B2A_Busbar_A", "319_3_BRK_Cable_B2A_Busbar_B"]}
      - {group: "Cable_B2B", max_closed: 1, members: ["319_3_BRK_Cable_B2B_Busbar_A", "319_3_BRK_Cable_B2B_Busbar_B"]}
      - {group: "Cable_B1A", max_closed: 1, members: ["319_3_BRK_Cable_B1A_Busbar_B", "319_3_BRK_Cable_B1A_Busbar_C"]}
      - {group: "Cable_B1B", max_closed: 1, members: ["319_3_BRK_Cable_B1B_Busbar_B", "319_3_BRK_Cable_B1B_Busbar_C"]}
      - {group: "Cable_A2A", max_closed: 1, members: ["319_3_BRK_Cable_A2A_Busbar_B", "319_3_BRK_Cable_A2A_Busbar_C"]}
      - {group: "Cable_A2B", max_closed: 1, members: ["319_3_BRK_Cable_A2B_Busbar_B", "319_3_BRK_Cable_A2B_Busbar_C"]}
      - {group: "Cable_A1A", max_closed: 1, members: ["319_3_BRK_Cable_A1A_Busbar_A", "319_3_BRK_Cable_A1A_Busbar_C"]}
      - {group: "Cable_A1B", max_closed: 1, members: ["319_3_BRK_Cable_A1B_Busbar_A", "319_3_BRK_Cable_A1B_Busbar_C"]}
      - {group: "Cable_C2A", max_closed: 1, members: ["319_3_BRK_Cable_C2A_Busbar_A", "319_3_BRK_Cable_C2A_Busbar_C"]}
      - {group: "Cable_C2B", max_closed: 1, members: ["319_3_BRK_Cable_C2B_Busbar_A", "319_3_BRK_Cable_C2B_Busbar_C"]}
      - {group: "Cable_C1A", max_closed: 1, members: ["319_3_BRK_Cable_C1A_Busbar_A", "319_3_BRK_Cable_C1A_Busbar_B"]}
      - {group: "Cable_C1B", max_closed: 1, members: ["319_3_BRK_Cable_C1B_Busbar_A", "319_3_BRK_Cable_C1B_Busbar_B"]}

  # ─────────────────────────────────────────────────────────────────
  # Switchboard 319-4  (Building 319, syslab-52)
  # ─────────────────────────────────────────────────────────────────
  - name: "Switchboard 319-4"
    type: full-telemetry
    description: |
      Crossbar extension (Building 319). 3 busbars: A, B, C.
      Connects to 310-2 via Cable J (4 runs) and to 330-12 via Cable K
      (4 runs). Houses Grid Emulator B2B secondary (GridEmu bay) and
      P2X equipment. The Cross bays linking 319-3 ↔ 319-4 are in the
      separate Crossbar group. Most cable bays have inline ports.
    switches:
      # Spare_1 (A, C)
      - {name: "319_4_BRK_Spare_1_Busbar_A", default_closed: false}
      - {name: "319_4_BRK_Spare_1_Busbar_C", default_closed: false}
      # Spare_2 (A, B)
      - {name: "319_4_BRK_Spare_2_Busbar_A", default_closed: false}
      - {name: "319_4_BRK_Spare_2_Busbar_B", default_closed: false}
      # P2X (A, C)
      - {name: "319_4_BRK_P2X_Busbar_A", default_closed: false}
      - {name: "319_4_BRK_P2X_Busbar_C", default_closed: false}
      # GridEmu (B, C)
      - {name: "319_4_BRK_GridEmu_Busbar_B", default_closed: false}
      - {name: "319_4_BRK_GridEmu_Busbar_C", default_closed: false}
