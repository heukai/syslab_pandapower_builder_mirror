      - {group: "Cable_J1B", max_closed: 1, members: ["319_4_BRK_Cable_J1B_Busbar_B", "319_4_BRK_Cable_J1B_Busbar_C"]}
      - {group: "Cable_J2A", max_closed: 1, members: ["319_4_BRK_Cable_J2A_Busbar_A", "319_4_BRK_Cable_J2A_Busbar_C"]}
      - {group: "Cable_J2B", max_closed: 1, members: ["319_4_BRK_Cable_J2B_Busbar_A", "319_4_BRK_Cable_J2B_Busbar_C"]}

  # ─────────────────────────────────────────────────────────────────
  # Switchboard 117-2  (Building 117, syslab-11)
  # ─────────────────────────────────────────────────────────────────
  - name: "Switchboard 117-2"
    type: full-telemetry
    description: |
      Building 117 main panel (DR1 hall). 3 busbars: A, B, and a
      dedicated Grid busbar. Houses battery storage (batt1), PV
      inverter (pv117), and CEE sockets. Connected to 319-3 via
      Cable C (4 runs). Internal X-cables (single-breaker) crosslink
      to 117-5. Grid_2 bay has 3 breakers (Grid busbar + A + B).
    switches:
      # Grid_2 — 3 breakers (Grid, A, B)
      - {name: "117_2_BRK_Grid_2_Busbar_Grid", default_closed: false}
      - {name: "117_2_BRK_Grid_2_Busbar_A", default_closed: false}
      - {name: "117_2_BRK_Grid_2_Busbar_B", default_closed: false}
      # Battery (A, B)
      - {name: "117_2_BRK_Battery_Busbar_A", default_closed: false}
