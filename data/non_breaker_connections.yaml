# Non-breaker internal connections
#
# These represent physical wiring or equipment that hardware.xml does NOT
# describe because it only models breaker-equipped connections.  Each
# entry connects two bus endpoints using the same naming convention as
# cables.yaml.
#
# These connections are maintained from engineering knowledge and must be
# reviewed with SYSLAB staff when the physical installation changes.
#
# Source: SYSLAB switchboard diagrams (SVG), on-site inspection records.
#
# NOTE: Back-to-back converters (ABB B2B, Grid Emulator) are NOT listed
# here — they electrically isolate their two sides and are modeled
# separately in converter_connections.yaml.

connections: []
