# Inter-substation cable connections
#
# Each cable connects a bus endpoint on one switchboard to a bus endpoint
# on another.  Bus names follow the pandapower naming convention:
#   Busbar:  "{sw}_Busbar-{letter}"   e.g. "319-3_Busbar-A"
#   Bay:     "{sw}_{bay}"             e.g. "319-2_Cable_A1A"
#
# The bus1/bus2 names must match buses created from hardware.xml bay and
# busbar definitions.  When a cable lands directly on a busbar (no bay
# on that side), the busbar name is used.
#
# Source: SYSLAB campus cable installation records.
# Review with SYSLAB staff when cables are added, removed, or rerouted.

cables:
  # ── Cable A: 319-2 ↔ 319-3 ──
  - name: Cable A1A
    bus1: 319-2_Cable_A1A
    bus2: 319-3_Cable_A1A
    length_km: 0.021
    cable_type: "NOIK-AL-M 4x95 0.6/1kV"

  - name: Cable A1B
