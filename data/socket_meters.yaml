# Meters of the CEE socket ports, declared by the maintainer (2026-10-20).
#
# Every socket is ONE physical plug behind two busbar breakers (Busbar_A, Busbar_B;
# at most one closed). hardware.xml does not define plugs, so the model has one bus
# per socket (see derive_socket_ports). This file only says which measurement belongs
# to which busbar feed of that plug:
#   meters: {A: <name>, B: <name>}   one meter per busbar (319-2 CEEx2, 117-2 CEEx2);
#                                    the active one is on the closed busbar
#   meter: <name>                    one meter for the plug (all other CEE bays)
# Names are the data's measurement names without type prefix and unit
# (P_CEEx2.B[kW] -> CEEx2.B).

sockets:
  - port: "319-2 CEEx2"
    meters: {A: "CEEx2.A", B: "CEEx2.B"}
    source: "declared by the maintainer; hardware.xml lists a single instrument CEEx2, the data header has .A/.B"
  - port: "117-2 CEEx2"
    meters: {A: "CEEx2_1", B: "CEEx2_2"}
    source: "declared by the maintainer (_1 = Busbar A, _2 = Busbar B); hardware.xml lists both instruments without a busbar"
  - {port: "319-2 CEE", meter: "CEE", source: "hardware.xml instrument"}
  - {port: "117-5 CEEx1_1", meter: "CEEx1_1", source: "hardware.xml instrument"}
  - {port: "117-5 CEEx1_2", meter: "CEEx1_2", source: "hardware.xml instrument"}
  - {port: "310-2 CEE_1", meter: "CEE_1", source: "hardware.xml instrument"}
  - {port: "310-2 CEE_2", meter: "CEE_2", source: "hardware.xml instrument"}
  - {port: "716-2 CEE", meter: "CEE", source: "hardware.xml instrument"}
