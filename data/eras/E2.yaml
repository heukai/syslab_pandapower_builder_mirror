# Configuration era E2: switchboard 117-6 (NEVIC) and the Aircon turbine (overview figure v2).
#
# Drafted 2026-10-25 (see E4.yaml). No hardware.xml: known from the data files and the figures only (header-only,
# unverified models). There is no era E1: figure v1 (swbdrawing-qmarks-20120101.svg, displayed from 2011-12-21)
# was replaced on 2012-01-13 by v2, its wide-screen variant with NEVIC, before any change it shows reached the data.

era: E2
title: Switchboard 117-6 and the Aircon turbine
figure: 2                  # syslab media/swbdrawing-qmarks-wide-20120101.svg, later switchboard_overview_2.svg
start: 2012-02-18          # first operational evidence: 319-2 bay Aircon replaces Bonus
end: 2013-07-31            # start of E3

basis: header-only       # no hardware.xml: models of this era are reconstructed from data headers

major_change:
  summary: >-
    New figure (v1, then its wide variant v2, both dated 2012-01-01) with switchboard 117-6 for the NEVIC charging
    posts, the Aircon wind turbine in place of Bonus on 319-2, and the B2B converter as Ship/Shore.
  evidence:
    - {role: announced, source: figure, ref: "syslab 8f21bb064 (v1), displayed from 0c3a8b44d", date: 2011-12-21}
    - {role: announced, source: figure, ref: "syslab 251dd9040 (v2, wide, with NEVIC)", date: 2012-01-13}
    - {role: evidenced, source: header, ref: "column archive 319_2 (Aircon)", date: 2012-02-18}
    - {role: evidenced, source: header, ref: "column archive 117_6", date: 2012-05-03}

operational_periods:
  - id: 2-a
    from: 2012-02-18
    switchboards: [117-2, 117-4, 117-5, 319-2, 715-2]
    note: switchboards with data files; the 319-3 crossbar (Busbars A/B/C) is drawn since 2009 but not logged
  - id: 2-b
    from: 2012-05-03
    switchboards: [117-2, 117-4, 117-5, 117-6, 319-2, 715-2]
    note: 117-6 logs meters from 2012-05-03, breakers from 2012-06-27
  - id: 2-c
    from: 2013-05-19
    switchboards: [117-2, 117-4, 117-5, 117-6, 319-2, 319-3, 715-2]
    note: 319-3 logs from 2013-05-19

