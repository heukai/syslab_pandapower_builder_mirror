  - {revision: "6.2", entries: [E6-017]}                           # 319-3 ABB_Pri
  - {revision: "6.3", entries: [E6-008, E6-018, E6-019, E6-020]}   # 319-3 and 319-4 as built
  - {revision: "6.4", entries: [E6-021, E6-022, E6-023, E6-009, E6-012]}   # validated syslab-11 configuration
