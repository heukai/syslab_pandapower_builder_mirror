  - {revision: "6.7", entries: [E6-011]}                           # 310-2 Boiler

# Model versions: era.revision.model, plus a fourth level for experiment variants (a project code; form to settle).
# Levels 1 and 2 follow the lab's changes; level 3 only adds knowledge (superseded ones fade into the git history).
model_versions:
  - version: "6.6.1"
    revision: "6.6"
    published: 2026-10-20
    note: CEEx2 sockets as two plugs (one bus and port per socket); numbered 6.4.1 until 2026-11-03
    status: superseded
  - version: "6.6.2"
    revision: "6.6"
    published: 2026-10-24
    note: 117-2 CEEx2 meters corrected (CEEx2_2 is the Busbar A socket, found in the data); numbered 6.4.2 until 2026-11-03
    validated:
      - {day: 2026-06-25, check: "island_residuals, all islands; largest (319-3) RMSE 0.22 kW at 1 min", with: "6.6.2.J1A"}
    status: current
  - version: "6.6.2.J1A"
    revision: "6.6"
    published: 2026-10-24
    note: variant for the 2026 J1A experiment (converter set-up); was written 6.4.2/j1a-2026
    status: variant
  - version: "6.7.1"
    revision: "6.7"
    built: 2026-11-03
    note: >-
      first model built from the configuration in force on a day (build_model --conf-repo syslab --conf-date
      2026-08-13); against 6.6.2 only 310-2 Spare_1 -> Boiler; not published; 2026-09-08 island_residuals: all
      islands with a slack meter close (largest RMSE 0.040 kW at 1 min), but 310-2 was idle that day, so the Boiler
      change is not tested by it
    status: superseded
  - version: "6.7.2"
    revision: "6.7"
    built: 2026-11-07
    note: >-
      6.7.1 with the meter names of all metered bays from hardware.xml (bay_meters, auto-update ticket 09; only
      117-4 Grid -> Grid_4 differs from its bay); network, switch map, converters and catalog as 6.7.1; not
      published; on both days the published model misses the Boiler (310-2 island 16.9 and 36.7 kW RMSE)
    validated:
      - {day: 2026-09-21, check: "validate_day (island periods of at least 2 h, 06:00-18:00): every checkable grid-connected island closes; largest (319-3) RMSE 0.12 kW at 1 min, worst 716-2 0.32 kW; 310-2 with the Boiler 0.03 kW; the 12:45-16:08 grid-emulator island (slack 319-4 GridEmu, 7 boards) is converter-driven, not used (P mean -3.0 kW, RMSE 5.2 kW; the emulator's metering to be looked at)"}
      - {day: 2026-09-24, check: "validate_day (island periods of at least 2 h, 06:00-18:00): every checkable island closes; largest (319-3) RMSE 0.09 kW at 1 min, worst 330-13 0.17 kW; 310-2 with the Boiler 0.07 kW"}
    status: current

# Header periods (proposed 2026-10-25, column-archive cross-check): stretches where the data files carry other
# names than the master hardware.xml in force. They do not change the model; they say which names the data of
# that time use, so a column map can translate them into this era's model, and selection warns there.
# kind: lag (names of an older config: the node had not restarted), lead (names of a later config),
# unmatched (names of no config), transition (one day around a restart), meter-lag (meter names only).
header_periods:
  - id: E6-H01
    switchboards: [117-2, 117-4, 117-5, 715-2, 716-2]
    from: 2023-06-16
    to: 2023-06-22
    kind: lead
    carries: "syslab ebb1fb939 (committed 2023-06-23)"
    note: the rebuild runs a week before its configuration is committed
    status: proposed
    column_map:
    - status: proposed
      from: 2023-06-16
      to: 2023-06-22
      targets:
      - from: 2023-06-16
        nodes:
          syslab-09: 29e3f21a0
          syslab-11: 948f15ef1
          syslab-29: b9d04a949
      switchboards:
        117-2:
          carried: ebb1fb939
          pairs:
          - {data: 117_2_BRK_Grid_Grid, model: 117_2_BRK_Grid_Busbar_Grid, rule: same bay and busbar}
          same: 2
          unmatched_data:
          - 117_2_BRK_Battery_Busbar A
          - 117_2_BRK_Battery_Busbar B
          - 117_2_BRK_CEEx2_Busbar A
          - 117_2_BRK_CEEx2_Busbar B
          - 117_2_BRK_CableC1A_Busbar A
          - 117_2_BRK_CableC1A_Busbar B
          - 117_2_BRK_CableC1B_Busbar A
          - 117_2_BRK_CableC1B_Busbar B
