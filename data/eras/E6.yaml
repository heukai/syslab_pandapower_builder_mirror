# Configuration era E6: after the 2023 rebuild (overview figure v6).
#
# One file per configuration era (map "dated model versions", builder .scratch/features/model-versions/).
# A change entry is one configuration change; `status: confirmed` entries change model versions,
# `proposed` ones wait for a person. Names are the hardware.xml names. Lab refs are commits of the
# lab repositories (read-only; never pushed to); they stay in this private builder.
# The form is a proposal to validate with the technical staff.

era: E6
title: After the 2023 rebuild
figure: 6
start: 2023-06-16          # first operational evidence: rebuild names in the headers of five switchboards
                           # (proposed 2026-10-25 from the column-archive cross-check; was 2023-06-23)
end: 2026-10-05            # start of E7 (figure v7 check-in)

major_change:
  summary: >-
    2023 rebuild: busbars renamed A/B, "Solar" bays renamed PV, 319-3 on its own node (syslab-52)
    with the new switchboard driver; new switchboards commissioned in stages until 2023-10-19.
  evidence:
    - {role: materialized, source: hardware.xml, ref: "syslab 86f2e627d (319-2)", date: 2023-06-14}
    - {role: materialized, source: hardware.xml, ref: "syslab ebb1fb939 (319-3 on syslab-52)", date: 2023-06-23}
    - {role: announced, source: figure, ref: "syslab-userspace, display loads figure v6", date: 2023-06-23}
    - {role: evidenced, source: header, ref: "column archive: rebuild names on 117-2, 117-4, 117-5, 715-2, 716-2", date: 2023-06-16}

