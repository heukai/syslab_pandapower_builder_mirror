inquiries:
  - id: E4-Q1
    about: cables before the rebuild
    question: >-
      Cables A1, A2, B1, B2, C1, C2, D1, E1, E2, F1 and the Ext. 117-2/117-5 cable: were they single cables or already
      the parallel pairs (A1A/A1B, ...) the 2023 configuration names? Length and type each (the builder's cable data
      describe the cables from 2023 on).
  - id: E4-Q2
    about: equipment behind the bays
    question: Machine set, Battery, EDISON 1-3, CHP, Heatpump 1/2, Flexhouse 1-3, Bonus/Aircon, Gaia, Solar ratings in 2015-2023.

